spring.application.name=assetmanagement

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/asset_management
spring.datasource.username=postgres
spring.datasource.password=832007

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000


logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG
logging.level.org.flywaydb=DEBUG